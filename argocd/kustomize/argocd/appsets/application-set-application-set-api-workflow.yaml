apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workflow-api
  namespace: workflow-api
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - git:
            repoURL: <a git repo>
            revision: HEAD
            directories:
            - path: my-eu-apps/*
        - clusters:    
            selector:
              matchLabels:
                type: "workload"     
                region: "eu"                     
  template:      
    metadata:
      name: '{{index .path.segments 3}}-{{.name}}'     
    spec:
      project: workflow-api
      source:
        repoURL: <a git repo>
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: '{{.server}}'
        namespace: 'eu-only-{{index .path.segments 1}}'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true  
