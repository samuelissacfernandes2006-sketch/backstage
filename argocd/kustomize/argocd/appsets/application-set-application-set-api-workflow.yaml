apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workflow-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - list:
            elements:
              - cluster: kind-kind
                url: https://kubernetes.default.svc
        - git:
            repoURL: https://github.com/samuelissacfernandes2006-sketch/Teste
            revision: main
            directories:
            - path: kustomize/workflow-api/overlays/dev   
  template:      
    metadata:
      name: 'teste'     
    spec:
      destination:
        namespace: workflow-api
        name: '{{.cluster}}'
      project: workflow-api
      source:
        path: '{{.path.path}}'
        repoURL: https://github.com/samuelissacfernandes2006-sketch/Teste
        targetRevision: main

      syncPolicy:
        syncOptions:
          - CreateNamespace=true  
